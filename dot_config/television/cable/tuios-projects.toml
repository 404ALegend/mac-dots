[metadata]
name = "tuios-projects"
description = "Open zoxide directories as TUIOS sessions"
requirements = ["zoxide", "tuios"]

[source]
command = "zoxide query -l"
no_sort = true
frecency = false

[preview]
command = "eza -la --color=always '{}'"

[keybindings]
enter = "actions:open"

[actions.open]
description = "Switch to or create a TUIOS session"
command = "tuios switch-session --create --cwd '{}' \"$(basename '{}')\""
mode = "execute"
