[metadata]
name = "tuios-projects"
description = "Focus active agent panes, switch TUIOS sessions, or open project directories"
requirements = ["jq", "tuios", "zoxide"]

[source]
command = '''
{
  omp_title() {
    local session=$1 window=$2 tty record session_file
    tty="$(tuios get-window --session "$session" --json "$window" 2>/dev/null | jq -r '.tty // empty')"
    record="$HOME/.config/omp/agent/terminal-sessions/${tty##*/}"
    [ -f "$record" ] || return
    session_file="$(sed -n '2p' "$record")"
    [ -f "$session_file" ] || return
    jq -r 'select(.type == "title") | .title' "$session_file" 2>/dev/null | tail -n 1 | tr '\t\n' '  '
  }

  tuios list-agents --all-sessions --all --json 2>/dev/null |
    jq -r '
      .agents[]
      | select(
          .harness_id != ""
          or .agent_session_id != ""
          or (.name | test("^omp(-|$)"))
        )
      | [
          .session,
          .window_id,
          .name,
          (if .harness_id != "" then .harness_id else "omp" end),
          .state,
          .cwd
        ]
      | @tsv
    ' |
    while IFS=$'\t' read -r session window name harness state cwd; do
      title="$(omp_title "$session" "$window")"
      if [ -n "$title" ]; then
        summary="$title"
      else
        summary="$name · $harness · $state · $cwd"
      fi
      printf 'agent\t%s\t%s\t%s\t🤖\n' "$session" "$window" "$summary"
    done
  tuios ls --json 2>/dev/null |
    jq -r '.[] | ["session", .name, "", "\(.window_count) panes · \(.branch // "no branch")", ""] | @tsv'
  printf '%s\t%s\t%s\t%s\t%s\n' \
    project "$HOME/Developer" "" developer "📁" \
    project "$HOME/.local/share/chezmoi" "" "base dotfiles" "📁" \
    project "$HOME/.local/share/chezmoi-personal" "" "personal dotfiles" "📁" \
    project "$HOME/alter-ego" "" "Alter Ego" "📁"
  zoxide query -l | while IFS= read -r directory; do
    printf 'project\t%s\t\tzoxide\t📁\n' "$directory"
  done
} | awk -F '\t' '!seen[$1 FS $2 FS $3]++'
'''
display = "{split:\t:4}  {split:\t:1}  ({split:\t:3})"
no_sort = true
frecency = false

[preview]
command = "case '{split:\t:0}' in agent) tuios get-window --session '{split:\t:1}' --json '{split:\t:2}' | jq ;; session) tuios list-windows --session '{split:\t:1}' --json | jq ;; project) eza -la --color=always '{split:\t:1}' ;; esac"

[keybindings]
enter = "actions:open"

[actions.open]
description = "Focus the selected agent pane, switch sessions, or open a project"
command = "case '{split:\t:0}' in agent) tuios switch-session '{split:\t:1}' && tuios focus-window --session '{split:\t:1}' '{split:\t:2}' ;; session) tuios switch-session '{split:\t:1}' ;; project) tuios switch-session --create --cwd '{split:\t:1}' \"$(basename '{split:\t:1}')\" ;; esac"
mode = "execute"
