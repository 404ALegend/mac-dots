[metadata]
name = "mounts"
description = "List mounted filesystems"
requirements = ["df", "awk"]

[source]
command = "df -h | awk 'NR > 1 {print $9 \"\\t\" $1 \"\\t\" $2 \"\\t\" $3 \"\\t\" $4 \"\\t\" $5}'"
display = "{split:\\t:0}"

[preview]
command = "df -h '{}' && echo && ls -la '{}' 2>/dev/null | head -20"

[keybindings]
enter = "actions:cd"

[actions.cd]
description = "Open a shell in the selected mount point"
command = "cd '{}' && $SHELL"
mode = "execute"
