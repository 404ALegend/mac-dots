[metadata]
name = "git-repos"
requirements = ["fd", "git"]
description = """
A channel to select from git repositories on your local machine.

This channel uses `fd` to find directories that contain a `.git` subdirectory, and then allows you to preview the git log of the selected repository.
"""

[source]
# Project repositories live under ~/Developer.
command = "fd -g .git -HL -t d -d 8 --prune \"$HOME/Developer\" --exec dirname '{}'"
display = "{split:/:-1}"

[preview]
command = "cd '{}'; git log -n 200 --pretty=medium --all --graph --color"

[keybindings]
enter = "actions:sesh"
ctrl-e = "actions:edit"
ctrl-s = "actions:shell"

[actions.sesh]
description = "Switch to or create a Sesh session for repository"
command = "cd '{}' && sesh connect --switch"
mode = "execute"

[actions.edit]
description = "Open the repository in editor"
command = "${EDITOR:-nvim} '{}'"
shell = "bash"
mode = "execute"

[actions.shell]
description = "Open a new shell in the selected repository"
command = "cd '{}' && $SHELL"
mode = "execute"
