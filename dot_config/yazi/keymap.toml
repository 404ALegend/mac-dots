[[mgr.prepend_keymap]]
on = [ "g", "i" ]
run = "plugin lazygit"
desc = "Open Lazygit"

[[mgr.prepend_keymap]]
on = [ "g", "f" ]
run = 'shell --block -- python3 "$HOME/.config/yazi/ffmpeg-convert.py" %h'
desc = "Convert media with FFmpeg"

[[mgr.prepend_keymap]]
on = "H"
run = "plugin duckdb -1"
desc = "Scroll DuckDB preview left"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin duckdb +1"
desc = "Scroll DuckDB preview right"
