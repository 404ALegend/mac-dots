nerdfont: true
worktree_dir: .worktrees
mode: session
window_prefix: "{project}-"
agent: omp
status_format: false
window_placement: after_current
merge_strategy: rebase
merge_keep: false

dashboard:
  close_on_jump: false

windows:
  - name: dashboard
    panes:
      - command: workmux dashboard -t worktrees
        focus: false

  - name: shell
    panes:
      - focus: false

  - name: agent
    panes:
      - command: <agent>
        focus: true
