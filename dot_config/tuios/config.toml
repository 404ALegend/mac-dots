# TUIOS keeps sessions alive; Sesh selects projects and sessions.
[startup]
layout = "scrolling"
open_default_window = true
tiled = true

[appearance]
theme = "catppuccin_mocha"
dockbar_position = "top"
dock_compact = true
dock_prefix_indicator = "badge" # need to figure out what this one is
dock_mode_pill = "input"
scroll_column_presets = [100]
niri_scroll_cells = 16
border_style = "normal"
shared_borders = true
gap = 0
dock_pill_caps = false 
frame_panels = false
pane_overlays = true
window_title_position = "right"
window_title_style = "plain"
window_title_align = "right"
hide_window_buttons = true
window_button_style = "dots"
hide_scrollbar = false
copy_search_max_matches = 1000
dim_foreground = true
dim_unfocused = 65 
dim_multifocus = true
zoom_size = 100
animation_speed = 100
zen_mode = "disabled"

[keybindings]
preset = "tmux"

[keybindings.prefix_mode]
prev_agent = []

[[keybindings.command]]
name = "project-picker"
key = "prefix+K"
type = "popup"
command = "sesh picker"
description = "Open a project"
width = "80%"
height = "90%"

[appearance.sidebar]
enabled = false
header_case = "lowercase"
row_style = "bar"
header_style = "auto"

[appearance.scrollbar]
style = "thin"

[appearance.sidebar.left]
enabled = false
width = 24

[appearance.sidebar.right]
enabled = false

[spotlight]
enabled = false

[motion]
scroll = "on"

[panes]
navigator_layout = "cards"
