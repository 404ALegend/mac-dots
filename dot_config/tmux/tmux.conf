
# Options
set -g mouse on # Enable mouse support
set -g set-clipboard on # Use system clipboard
set -g status-position top # MacOS / darwin style
set -g base-index 1 # Start indexing windows at 1 instead of 0
set -g renumber-windows on # Renumber all windows upon close
set -g detach-on-destroy off # Don't exit from tmux when closing a session
set -g escape-time 0 # Zero-out escape time delay
# Preserve modified keys such as Shift-Enter for OMP inside tmux.
set -g extended-keys on
set -g extended-keys-format csi-u
set -g cursor-style bar # Default cursor: blinking vertical bar
# Keep Ghostty's blinking line cursor when tmux resets the terminal.
set -as terminal-overrides ',xterm-ghostty:Se=\E[5 q'
set -g status-interval 5 # Update the status bar every 5 sec

# Sesh session picker and cache updates.
bind-key -N "session picker (via sesh)" K display-popup -E -w 50% -h 90% -d '#{pane_current_path}' "sesh picker"
bind -N "last session (via sesh)" L run-shell "sesh last"
set-hook -g session-created 'run-shell -b "sesh cache refresh"'
set-hook -g session-closed 'run-shell -b "sesh cache refresh"'
set-hook -g client-session-changed 'run-shell -b "sesh cache refresh"'


#tpm section
set -g @plugin 'tmux-plugins/tpm'

# list of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Plugin Settings
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
set -g @resurrect-capture-pane-contents "on"


# Catppuccin Mocha status and window styling.
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]},#{#[bg=#{@thm_bg},fg=#{@thm_green}]}}  #S#{?#{||:#{==:#{pane_current_path},$HOME},#{==:#{pane_current_path},#{session_path}}},,: #{s|.*/([^/]+/[^/]+)|\\1|:#{s|^$HOME|~|:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg}]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/#[fg=#{@thm_overlay_0}]│#[fg=#{@thm_mauve}] 󰊢 /; s/$/ /')"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Show the active Workmux worktree session only.
set -g status-right '#{?#{m:*/.workmux/*,#{session_path}},#[fg=#{@thm_mauve}] 󰙨 #{session_name} ,}'

set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_overlay_1}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"


# Initialize TMUX plugin manager (keep at bottom). Bootstrap TPM into the same
# plugin directory used by the rest of this config.
if-shell '[ -x "$HOME/.config/tmux/plugins/tpm/tpm" ] || git clone https://github.com/tmux-plugins/tpm "$HOME/.config/tmux/plugins/tpm"' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'
