# Shared, work-safe tool configuration.
[tools]
"aqua:dlvhdr/diffnav" = "latest"
"github:duckdb/duckdb" = { version = "latest", matching = "duckdb-cli" }
bat = "latest"
betterleaks = "latest"
bun = "latest"
chezmoi = "latest"
coreutils = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gitleaks = "latest"
go = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
node = "latest"
oh-my-pi = { version = "latest", rename_exe = "omp" }
python = "latest"
ripgrep = "latest"
starship = "latest"
television = "latest"
"github:404ALegend/sesh" = "v2.30.1-tuios.2"
tlrc = "latest"
tmux = "latest"
 "github:Gaurav-Gosain/tuios" = "latest"
uv = "latest"
"github:raine/workmux" = "latest"
"github:agavra/tuicr" = "latest"
zoxide = "latest"
"npm:@doist/todoist-cli" = "latest"
"npm:@yaakapp/cli" = "latest"
yazi = "latest"
"aqua:ip7z/7zip" = "latest"

# Heavy, project-local tools. Enable these only in a project configuration.
# dotnet = "latest"
# elixir = "latest"
# erlang = "latest"
# java = "latest"
# kotlin = { version = "latest", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
# lazydocker = "latest"
# podman = { version = "latest", matching = "podman-remote" }
# postgres = "latest"
# rust = "latest"
# zig = "latest"

[settings]
download_cache = false
always_keep_install = false
trusted_config_paths = ["~/Developer/"]
verbose = false
http_timeout = "30s"
jobs = 4
raw = false
yes = false
not_found_auto_install = true
task.output = "prefix"
paranoid = false
env_file = ".env"
experimental = true
status = { missing_tools = "if_other_versions_installed", show_env = false, show_tools = false }

[settings.pipx]
uvx = true

[settings.self_update]
auto = true
